- name: Deploy thai-folk-medicine
  hosts: prod
  gather_facts: false
  vars:
    compose_file: "{{ app_dir }}/compose.prod.yaml"
  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Render production compose file
      ansible.builtin.template:
        src: templates/compose.prod.yaml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Render environment file
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Log in to GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
        stdin: "{{ ghcr_token }}"
      no_log: true

    - name: Pull images
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_file }}" pull
        chdir: "{{ app_dir }}"

    - name: Start the stack
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_file }}" up -d
        chdir: "{{ app_dir }}"

    - name: Seed the database (idempotent; no-op if already seeded)
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_file }}" --profile seed run --rm seed
        chdir: "{{ app_dir }}"

    - name: Install nginx reverse-proxy site
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/conf.d/{{ nginx_conf_name }}"
        mode: "0644"
      notify: reload nginx

    - name: Prune dangling images
      ansible.builtin.command:
        cmd: docker image prune -f

  handlers:
    - name: reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
