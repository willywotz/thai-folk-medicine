services:
  backend:
    build: { target: development }
    environment:
      COOKIE_SECURE: "false"
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /src
          ignore:
            - .git/
        - action: rebuild
          path: ./backend/go.mod

  frontend:
    build: { target: development }
    environment:
      # Vite dev proxy: /api -> the backend container (host dev keeps the
      # vite.config.ts default of http://localhost:8080).
      VITE_API_TARGET: http://backend:8080
    develop:
      watch:
        # Vite HMR picks up source changes with no restart.
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/pnpm-lock.yaml
        - action: rebuild
          path: ./web/package.json
